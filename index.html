<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Quiz</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script>
</head>
<body>
  <main class="quiz-card">
    <p class="eyebrow">TEST YOUR KNOWLEDGE</p>
    <div class="quiz-top"><span id="progress">Question 1 of 5</span><span id="score">Score: 0</span></div>
    <div class="progress-track"><div id="progress-fill"></div></div>
    <h1 id="question">Question goes here</h1>
    <div id="answers" class="answers"></div>
    <p id="feedback" class="feedback" aria-live="polite"></p>
    <button id="next" class="next" type="button" disabled>Next question</button>
  </main>
</body>
</html>
